spring.application.name=Salao_API

# --- Conexão BD ---

# URL Limpa (Endereço + Banco + SSL)
spring.datasource.url=jdbc:postgresql://ep-hidden-sunset-acjl71xs-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require

# Credenciais Separadas
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# --- Configuração JPA (Padrão) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do JWT
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=86400000

# Configurações do Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mariacabelereirapoa@gmail.com
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.profiles.active=dev

logging.level.org.springframework.security=DEBUG